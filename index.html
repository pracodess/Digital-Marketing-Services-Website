<!doctype html>

      content="Turn clicks into calls & WhatsApp leads for local businesses in India."

    <!-- LocalBusiness Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Pracodee",
        "slogan": "Joh pasine se nahayega voh Itihaas badlega",
        "description": "Digital marketing and custom web development agency helping local businesses in India generate calls and WhatsApp leads.",
        "url": "https://[YOUR_DOMAIN]/",
        "telephone": "+91-7043799341",
        "email": "prathamworkash@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[YOUR_STREET_ADDRESS]",
          "addressLocality": "[YOUR_CITY]",
          "addressRegion": "[YOUR_STATE]",
          "postalCode": "[YOUR_PINCODE]",
          "addressCountry": "IN"
        },
        "openingHours": "[Mo-Sa 10:00-19:00]",
        "priceRange": "Rs. 5,999 - Rs. 29,999",
        "sameAs": [
          "https://www.instagram.com/pratham_chauhan07/",
          "https://www.linkedin.com/in/pratham-chauhan-0a285336b/",
          "https://www.youtube.com/@pracodee"
        ]
      }
    </script>

    <!-- FAQPage Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is ad spend billed? Is it included in the management fee?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your advertising budget is paid directly to Meta or Google from your own billing method. Our monthly management fee covers strategy, creative setup, targeting, and optimization separately."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take to launch a campaign or website?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paid Ads and Google Business Profile setup typically launch within [3 TO 5 BUSINESS DAYS], static websites within [7 TO 10 BUSINESS DAYS], and animated multi-page websites within [14 TO 21 BUSINESS DAYS]."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the domain, hosting, website code, and ad accounts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You retain 100% ownership of your domain, hosting account, Google Business Profile, and Meta/Google ad accounts."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide GST invoices for business expenses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "[SPECIFY GST POLICY, e.g., Yes, GST-compliant tax invoices are issued for services and memberships.]"
            }
          },
          {
            "@type": "Question",
            "name": "How long does SEO / Google Business Profile optimization take to show results?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Initial profile improvements occur within [7 TO 14 DAYS], while organic local rankings typically build momentum over [60 TO 90 DAYS]."
            }
          },
          {
            "@type": "Question",
            "name": "What is included in the Free Audit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We review your Website, Google Business Profile, or Meta Ad Account for conversion leaks, speed, or wasted ad spend and send actionable steps on WhatsApp within [24 TO 48 HOURS]."
            }
          },
          {
            "@type": "Question",
            "name": "What is your refund and cancellation policy?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "[SPECIFY REFUND & CANCELLATION POLICY]"
            }
          },
          {
            "@type": "Question",
            "name": "How does the Silver or Gold annual membership discount work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Silver (10% OFF) and Gold (15% OFF) annual memberships apply an instant discount across all service fees for 12 months, excluding third-party ad spend and domain/hosting."
            }
          },
          {
            "@type": "Question",
            "name": "How is campaign performance reporting shared?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Reports covering leads, calls, WhatsApp clicks, and next actions are shared via [WhatsApp / Email / PDF Summary]."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after my website is delivered (support and revisions)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Websites include [SPECIFY REVISION ROUNDS] plus [SPECIFY POST-LAUNCH SUPPORT WINDOW] of complimentary support."
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070B16] dark:text-slate-100 antialiased selection:bg-[#3B82F6]/30 selection:text-white">
